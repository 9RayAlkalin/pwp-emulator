<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pwp-emulator</title>
</head>
<body>
    <h2>pwp-emulator | Code by 9RayAlkalin</h2>
    <fieldset id="catalog">
        <legend>谱面</legend>
        <p><label>导入 <input id="file-input" type="file" multiple accept=".zip,.json,.csv,.ogg,.mp3,.wav,.m4a,.flac,.png,.jpg,.jpeg,.webp" disabled></label></p>
        <p>
            <label>搜索 <input id="search" type="search" placeholder="曲名、曲师、谱师"></label>
            <label>难度 <select id="filter"><option value="">全部</option><option>EZ</option><option>HD</option><option>IN</option><option>AT</option><option>SP</option><option value="LOCAL">本地</option></select></label>
        </p>
        <p><label>谱面 <select id="chart-select" disabled><option>正在启动…</option></select></label> <button id="load-chart" disabled>加载</button> <span id="catalog-count"></span></p>
        <small>支持 Phigros v1/v3 JSON、ZIP；也可拖入文件。导入仅保留在当前页面会话。</small>
    </fieldset>
    <fieldset id="chart-info" disabled>
        <legend>谱面信息</legend>
        <p><label>曲名 <input data-info="name" type="text"></label> <label>曲师 <input data-info="composer" type="text"></label></p>
        <p><label>曲绘 <input data-info="illustrator" type="text"></label> <label>谱师 <input data-info="charter" type="text"></label></p>
        <p><label>难度 / 等级 <input data-info="level" type="text" placeholder="IN Lv.15"></label></p>
    </fieldset>
    <p id="toast" role="status" aria-live="polite" hidden></p>
    <p id="drop-zone" hidden>松开以导入谱面（ZIP 或 JSON + 音乐 + 曲绘）。</p>
    <p id="loading-overlay" hidden><span id="loading-label">正在启动</span> <progress id="loading-fill" max="100" value="0"></progress> <span id="loading-text"></span></p>
    <fieldset>
        <legend>游玩</legend>
        <label><input id="autoplay" type="checkbox">Autoplay</label>
        <label>速度 <select id="speed"><option value="0.5">0.5×</option><option value="0.75">0.75×</option><option value="1">1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label>
        <button id="btn-restart" disabled>重新开始</button>
        <button id="btn-fullscreen" disabled>全屏</button>
        <button id="btn-export" disabled>导出视频</button>
    </fieldset>
    <details id="settings">
        <summary>设置</summary>
        <p><label><input data-setting="skipLoadingAnimation" type="checkbox">跳过加载动画</label></p>
        <fieldset id="player-profile">
            <legend>玩家资料</legend>
            <p><label>名称 <input data-setting="playerName" type="text" maxlength="20" value="9RayAlkalin"></label>
                <label>Player ID <input data-setting="playerId" type="text" inputmode="numeric" maxlength="12" value="00000000"></label></p>
            <p><label>RKS <input data-setting="playerRks" type="number" min="0" max="20" step="0.01" value="16.08"></label></p>
            <p><label>Challenge Mode Rank <input data-setting="playerChallengeModeRank" type="number" min="0" max="99" step="1" value="48"></label></p>
            <p><label>Challenge Mode 颜色 <select data-setting="playerChallengeModeTier"><option value="0">白</option><option value="1">绿</option><option value="2">蓝</option><option value="3" selected>红</option><option value="4">金</option><option value="5">彩</option></select></label>
                <label><input data-setting="playerShowName" type="checkbox" checked>显示玩家名称</label></p>
            <p><label>头像 <select data-setting="playerAvatar"><option value="OblivionPHIN">OblivionPHIN</option></select></label></p>
        </fieldset>
        <p><label>音乐音量 <input data-setting="volume" type="range" min="0" max="1" step="0.01"><output></output></label></p>
        <p><label>打击音量 <input data-setting="hitVolume" type="range" min="0" max="1" step="0.01"><output></output></label></p>
        <p><label>背景亮度 <input data-setting="brightness" type="range" min="0" max="1" step="0.01"><output></output></label></p>
        <p><label>音符大小 <input data-setting="noteScale" type="range" min="0.5" max="1.5" step="0.05"><output></output></label></p>
        <p><label>判定偏移 (ms) <input data-setting="offset" type="number" min="-500" max="500" step="1"></label> <small>正值提前判定</small></p>
        <p><label><input data-setting="apFcIndicator" type="checkbox">FC/AP 指示器</label> <label><input data-setting="effects" type="checkbox">后期与异象特效</label> <label><input data-setting="fullscreen" type="checkbox">开始时全屏</label></p>
    </details>
    <section id="player" hidden>
        <p id="bottom-bar">
            <button id="btn-play">开始</button>
            <input id="progress-wrap" type="range" min="0" max="100" step="0.01" value="0" list="progress-marks" aria-label="播放进度">
            <datalist id="progress-marks"></datalist>
            <span id="time-label">0.00 / 0.00</span>
        </p>
        <div id="stage"><canvas id="main-canvas" width="640" height="360" aria-label="谱面模拟器"></canvas></div>
    </section>
    <dialog id="export-overlay">
        <h2>导出视频</h2>
        <p><label>宽 <input id="exp-w" type="number" min="64" max="4096" step="2" value="1920"></label> <label>高 <input id="exp-h" type="number" min="64" max="4096" step="2" value="1080"></label></p>
        <p><button id="exp-p720">1280×720</button> <button id="exp-p1080">1920×1080</button> <button id="exp-pwin">窗口尺寸</button></p>
        <p><label>帧率 <select id="exp-fps"><option value="60">60</option><option value="30">30</option></select></label> <label>码率 (Mbps) <input id="exp-bitrate" type="number" min="1" max="80" value="10"></label></p>
        <p><label>开始 (s) <input id="exp-start" type="number" min="0" step="0.1" value="0"></label> <label>结束 (s) <input id="exp-end" type="number" min="0" step="0.1" value="0"></label></p>
        <p><button id="exp-whole">整首</button> <button id="exp-here">当前至末尾</button> <label><input id="exp-audio" type="checkbox" checked>含音乐</label></p>
        <p id="exp-est"></p>
        <p><button id="exp-go">开始导出</button> <button id="exp-cancel" disabled>取消导出</button> <button id="export-close">关闭</button></p>
        <div id="export-progress-wrap" hidden><progress id="export-progress-fill" max="100" value="0"></progress><p id="export-status"></p></div>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
